name: Verificar

# Corre en cada pull request antes de mezclar a main, para no depender
# solo del build en el deploy (que recien avisa un error DESPUES de
# publicado). No toca Firebase: no hace falta ningun secret para esto.
on:
  pull_request:
    branches: [main]
  # Tambien en main: asi la rama tiene su propio estado visible, y no
  # depende de acordarse de mirar el deploy para saber si esta sana.
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Que no se cuele nada privado en lo que se publica. Ya paso dos
      # veces y las dos se encontro de casualidad; ahora falla el CI.
      - run: npm run revisar-publicos
